name: calvados-slim
channels:
  - conda-forge
dependencies:
  - python=3.10
  # Core scientific stack (pins follow the CALVADOS fork's setup.py)
  - numpy=1.24
  - scipy=1.13
  - pandas=2.1.1
  - numba=0.60
  - statsmodels=0.14
  # Modelling (notebooks 6 and 9, src/model.py)
  # scikit-learn is pinned to the version that wrote data/modelling/CurveRegressor/model.pkl
  - scikit-learn=1.7.2
  - xgboost
  - joblib
  # Simulation engine and structure handling
  - openmm=8.2.0
  - pdbfixer
  - gemmi
  # Trajectory and structure analysis
  - mdanalysis=2.6.1
  - mdtraj=1.10
  - biopython=1.81
  # Configuration and templating
  - pyyaml=6.0
  - jinja2=3.1.2
  - tqdm=4.66
  # Plotting and notebooks
  - matplotlib-base=3.8
  - seaborn=0.13
  - jupyterlab
  - ipykernel
  # Tests for the CALVADOS fork
  - pytest=8.3.3
  - pip
  - pip:
      # Required by the CALVADOS fork (calvados/sequence.py) and src/analysis/features.py
      - localcider==0.1.21
      # Optional: entropy_features in src/analysis/features.py
      # - git+https://github.com/idptools/sparrow.git
      # Optional: ESM-2 embedding features in src/analysis/features.py (also needs pytorch)
      # - fair-esm
