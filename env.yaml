name: calvados
channels:
  - conda-forge
dependencies:
  - python=3.10
  # Core scientific stack
  - numpy=1.24
  - scipy=1.13
  - pandas=2.1
  - numba=0.60
  - statsmodels=0.14
  # Simulation engine + structure handling
  - openmm=8.2.0
  - pdbfixer
  - gemmi
  # Trajectory / structure analysis
  - mdanalysis>=2.8
  - mdtraj=1.10
  - biopython=1.81
  # Config / templating
  - pyyaml=6.0
  - jinja2=3.1.2
  - tqdm=4.66
  # Plotting + notebooks
  - matplotlib-base=3.8
  - seaborn=0.13
  - jupyterlab
  - ipykernel
  # Testing (CALVADOS fork)
  - pytest=8.3.3
  - pip
  - pip:
      # pip-only; required by the CALVADOS fork (calvados/sequence.py)
      - localcider==0.1.21
